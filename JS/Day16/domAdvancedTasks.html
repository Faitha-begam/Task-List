<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Advanced Tasks</title>
</head>
<body id="body" style="background-color: white; color: black;">
    <!-- Task 1 - Character Counter -->
     <h2>1.Character Counter</h2>
    <textarea onkeypress="countCharacter()" id="taskOneInput"></textarea>
    <p id="taskOneCount" >Total Characters: </p>


    <!-- Task 2 - Age Category Checker -->
     <h2>2.Age Category Checker</h2>
     <input type="number" id="taskTwoInput"> <br> <br>
     <button onclick="checkAge()">Check</button>
     <p id="taskTwoP"></p>
    
    
    <!-- Task 3 - Dark Mode / Light Mode -->
     <h2>3.Dark Mode / Light Mode</h2>
    <button id="taskThreeBtn" onclick="changeMode()">Dark Mode</button> <br> <br>


    <!-- Task 4 - Movie Ticket Calculator -->
     <h2>4.Movie Ticket Calculator</h2>
    <input type="number" id="taskFourInput"> <br> <br>
    <button onclick="calculateTotal()">Calculate</button>
    <p id="taskFourP">Total Amount: </p>


    <!-- Task 5 - Profile Card Generator -->
     <h2>5.Profile Card Generator</h2>
     <label for="name">Enter Name:</label>
     <input id="taskFiveName" type="text" placeholder="Enter Your Name"> <br> <br>
      <label for="role">Enter Role:</label>
     <input id="taskFiveRole" type="text" placeholder="Enter Your Role"> <br> <br>
      <label for="company">Enter Company Name:</label>
     <input id="taskFiveCompany" type="text" placeholder="Enter Company Name"> <br> <br>
     <button onclick="createProfile()">Generate Profile</button> <br> <br>
    
     <div style="display: none; background-color: lightblue; padding: 1px; text-align: center; width: 250px; border-radius: 5px;" id="profileCard" >
     </div>

     <!-- Task 6 - Search Hero -->
      <h2>6.Search Hero</h2>
      <input id="taskSixInput" type="text">
      <p id="taskSixP">hero found or not? </p>
      <button onclick="searchHero()">Search Hero</button> <br> <br>
    

    <!-- Task 7 -Lucky Number Checker -->
     <input type="number" id="taskSevenInput">
     <p id="taskSevenP">Lucky or Normal? </p>
     <button onclick="checkNumber()">Check LuckyNumber</button> <br> <br>
    

     <!-- Task 8 - Product Price Calculator -->
      <label for="pNAme">Product Name: </label>
      <input id="taskEightName" type="text" placeholder="Enter Product Name"> <br> <br>
      <label for="qnty">Quantity: </label>
      <input id="taskEightQnty" type="number" placeholder="Enter Quantity"> <br> <br>
      <label for="Price">Price: </label>
      <input id="taskEightPrice" type="number" placeholder="Enter Price For Each"> <br> <br>
      <button onclick="displayProduct()">Check Total</button> <br> <br>

      <div id="productCard" style="display: none; background-color: rgb(226, 223, 223); width: 250px; border-radius: 10px; padding: 10px;"></div>

    <script src="domAdvanced.js">

    </script>

</body>
</html>
