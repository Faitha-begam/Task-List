<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div>
        <div class="mb-2 ml-150 mt-50">           
            <button onclick="clitToHide()" class="bg-black text-white p-1 rounded transition duration-300 hover:scale-110">Click Me to Hide</button>
            <button onclick="clickToShow()" class="bg-black text-white p-1 rounded transition duration-300 hover:scale-110">Click Me to Show</button>
        </div>
 
        <div  style="display: flex" id="para"  class=" bg-blue-300 h-30 w-200 p-2 ml-100 mt-10 rounded">
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Obcaecati labore at vero ipsum pariatur aut
                odit facilis doloremque neque placeat repudiandae, possimus eum inventore expedita laborum rerum. Iure,
                praesentium blanditiis!</p>
        </div>
    </div>


    <script>
        const clitToHide = ()=>{
            const paraValue = document.getElementById("para")
            
              paraValue.style.display = "none"
        }
        const clickToShow = ()=>{
             const paraValue = document.getElementById("para")
            
            paraValue.style.display = "block"
        }
    </script>
</body>

</html>
