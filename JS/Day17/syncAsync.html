<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronous | Asynchronous</title>
</head>

<body>
    <script>

        //Callback - Execute function after another function completes.
        console.log("----------------------------");
        console.log("CALLBACK:");
        console.log("----------------------------");

        const outer = () => {
            console.log("Start");
        }
        const inner = (outerFunc) => {
            outerFunc()
            console.log("Data Retreived");
        }
        inner(outer)



        console.log("----------------------------");
        console.log("ASYNC AWAIT");
        console.log("----------------------------");
        // Async Await
        // const funcTwo = async()=>{
        //     const dummyData = await fetch()
        // }
        // funcTwo()
        // here "fetch()" is used to Communicate with APIs and retrieve/send data.



        // Callback Hell
        console.log("----------------------------");
        console.log("CALLBACK HELL");
        console.log("----------------------------");

        const funcOne = () => {

            setTimeout(() => {
                console.log("Start");
                setTimeout(() => {
                    console.log("data taken from external resource");
                    setTimeout(() => {
                        console.log("data stored");
                        setTimeout(() => {
                            console.log("Process Finished");
                            setTimeout(() => {
                                console.log("program end");

                            }, 1000)
                        }, 1000)
                    }, 1000)
                }, 1000)
            }, 1000)
        }
        funcOne()



        
    </script>
</body>

</html>
