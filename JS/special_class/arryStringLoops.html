<script>
    // Task1 - 1. Find Missing Number
    function findMissing(arr) {
        let n = arr.length + 1;

        for (let i = 1; i <= n; i++) {
            if (!arr.includes(i)) {
                console.log('Missing Number:', i);
            }
        }
    }
    findMissing([1, 2, 3, 5])

    // Task 2 - Find First Non-Repeated Character
    function firstNonRepeated(word) {
    for (let i = 0; i < word.length; i++) {
        let count = 0;

        for (let j = 0; j < word.length; j++) {
            if (word[i] === word[j]) {
                count++;
            }
        }

        if (count === 1) {
            return word[i];
        }
    }
}

console.log(firstNonRepeated("programming"));

    // Task 3 -  Find First Repeated Character
    function firstRepeated(word) {
    for (let i = 0; i < word.length; i++) {
        let count = 0;

        for (let j = 0; j < word.length; j++) {
            if (word[i] === word[j]) {
                count++;
            }
        }

        if (count < 1) {
            return word[i];
        }
    }
}
