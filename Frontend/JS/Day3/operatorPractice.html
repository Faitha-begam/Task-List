<script>
    let valueOne = 10
    let valueTwo = 20
     
    //  addition 

    let addedValue = valueOne + valueTwo
    addedValue += 30
    console.log('Added Value: ', addedValue);
    


    // subtraction

    let decreasedValue = addedValue
    decreasedValue -= 10
    console.log('Decreased Value: ', decreasedValue);



    //multiplication

    let multipliedValue = decreasedValue
    multipliedValue *= 5
    console.log('Multiplied Value: ', multipliedValue);



    //devision

    let devidedValue = multipliedValue
    devidedValue /= 2
    console.log('Devided Value: ', devidedValue);

    console.log('Initial Values Are:', valueOne, valueTwo);
    console.log('Final Value:', devidedValue);
</script>
