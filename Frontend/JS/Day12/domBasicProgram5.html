<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5 - Change Link</title>
</head>
<body>
    <a  id="website" onclick="changeLink()" href="#">Visit</a>
    <script>
        const changeLink = ()=>{
            const newlink = document.getElementById("website")
            newlink.href = "https://google.com"
        }
    </script>
</body>
</html>
