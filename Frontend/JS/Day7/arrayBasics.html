<script>
    // Task 1 – Push & Pop (Movie List)
    let array = ["GOAT", "Leo", "Master"]
    array.push("Ghilli")
    console.log('After push:' + array);
    array.pop()
    console.log('Array After Pop(Final Array):' + array);

    // Task 2 – Shift & Unshift (Hero List)
    let heros = ["Ajith", "Suriya", "SK"]
    heros.unshift("vijay")
    console.log("array after unshift: " + heros);
    heros.shift()
    console.log('Final array after shift: ' + heros);


    // Task 3 – Fruits Management
    let fruits = ["Apple", "Mango", "Orange"]
    fruits.push("Banana", "Grapes")
    console.log("array after push:" + fruits);
    fruits.pop()
    console.log("array after removing the last fruit:" + fruits);
    fruits.unshift("Pineapple")
    console.log("array after unshift:" + fruits);
    fruits.shift()
    console.log("Final Array:" + fruits);

    // Task 4 – Student Object
    let newObject = {
        name: "Sudhan",
        course: "MERN",
        city: "Chennai"
    }
    console.log('Using Dot Notation');

    console.log(newObject.name);
    console.log(newObject.course);
    console.log(newObject.city);

    console.log('Using Bracket Notation');

    console.log(newObject["name"]);
    console.log(newObject["course"])
    console.log(newObject["city"])

    // Task 5 – Mobile Store (Array of Objects)    
    let objArray = [
        {
            brand: "Samsung",
            price: 20000
        },

        {
            brand: "iPhone",
            price: 80000
        },

        {
            brand: "OnePlus",
            price: 35000
        }
    ]
    for (const mobile in objArray) {
        console.log(objArray[mobile].brand + " - " + objArray[mobile].price);
    }

    // Task 6 – Movie Collection Report (Array of Objects)
    let movieCollection = [
        {
            movie: "GOAT",
            collection: 800
        },

        {
            movie: "Leo",
            collection: 600
        },

        {
            movie: "Master",
            collection: 500
        }
    ]
    let total = 0
    let highCollection = 0
    let highCollMovie = 0 
    for(const collections in movieCollection){
        total +=  movieCollection[collections].collection
    }
    console.log('Total Collections: ', total);
    
    for(const collections in movieCollection){
        if (movieCollection[collections].collection > highCollection ){
           highCollection = movieCollection[collections].collection
           highCollMovie = movieCollection[collections].movie
        }
    }
    console.log("Highest collection: " + highCollection);
    console.log("High Collection Movie: " + highCollMovie);
    
    

</script>
