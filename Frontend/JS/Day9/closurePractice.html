    }

}

// Task 10 - Create a banking closure.
function banking(){
    let initialBalance = 5000
    return{
        deposit : function(amount){
          initialBalance += amount 
          console.log("After Deposite : ", initialBalance);
        },
        withdraw : function(amount){
            initialBalance -= amount 
            console.log("After Withdraw : ", initialBalance);
        },
        checkBalance : function(){
            console.log("Current Balance : " + initialBalance);
            
        }
    } 
}
const a = banking()
a.deposit(20000)
a.withdraw(20000)
a.checkBalance()
