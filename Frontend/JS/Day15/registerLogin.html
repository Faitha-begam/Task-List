<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Login</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class=" flex justify-center items-center min-h-screen">
    <form id="registerForm" class="bg-blue-300 p-5 rounded-xl flex flex-col gap-4 w-110 ">
         
    <h1 class="text-3xl font-bold text-center text-blue-900 mb-2">Registration Form</h1>

    <label class="text-gray-700" for="firstname">First Name :</label>

    <input id="fname" type="text" placeholder="Enter First Name" class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300">

    <label class="text-gray-700" for="lastname">Last Name :</label>

    <input id="lname" type="text" placeholder="Enter Last Name" class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300">

    <label class="text-gray-700" for="firstname">UserName :</label>

    <input id="mailid" type="email" placeholder="Enter UserName" class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300">

    <label class="text-gray-700" for="lastname">Date of Birth :</label>

    <input id="dateofbirth" type="date" placeholder="Enter Date of Birth" class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300">

    <input onclick="getValue(event)" type="submit" class="bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 hover:scale-105 transition duration-300">
    </form>
    </div>

    <script src="registerLogin.js">

    </script>
</body>
</html>
